[project]
name = "watchpost"
version = "0.1.0"
description = "Local-first camera monitor for macOS"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141",
    "uvicorn[standard]>=0.52",
    "numpy>=2.5",
    "pillow>=12.3",
    "pydantic>=2.13",
    "cryptography>=46",
]

[project.scripts]
watchpost = "watchpost.__main__:main"

[dependency-groups]
dev = [
    "pytest>=9.1",
    "httpx>=0.28",
    "ruff>=0.16",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["watchpost"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
